<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mark Calendar</title>

<!-- Handwritten font -->
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #dff5df; /* light green */
  margin: 0;
  padding: 10px;
}

select, button {
  margin: 5px;
  padding: 6px;
}

#calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  max-width: 380px;
  margin: auto;
}

.day {
  background: white;
  border: 1px solid #bbb;
  height: 75px;
  position: relative;
  cursor: pointer;
  border-radius: 6px;
}

.day-name {
  font-size: 12px;
  font-weight: bold;
  text-align: center;
}

.sunday {
  color: red;
}

.day-number {
  font-size: 14px;
  text-align: center;
}

.mark {
  font-family: 'Patrick Hand', cursive;
  font-size: 34px;
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
}

/* Popup */
#popup {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
}

#popupBox {
  background: white;
  padding: 20px;
  margin: 30% auto;
  width: 260px;
  border-radius: 8px;
}
</style>
</head>

<body>

<h3>Calendar</h3>

<select id="month"></select>
<select id="year"></select>

<div id="calendar"></div>

<br>
<button onclick="exportData()">Export Data</button>

<!-- Popup -->
<div id="popup">
  <div id="popupBox">
    <h4>Mark Date</h4>
    <button onclick="setMark('✔')">✔ Tick</button>
    <button onclick="setMark('✖')">✖ Cross</button>
    <button onclick="setMark('')">Clear</button>
    <br><br>
    <button onclick="closePopup()">Cancel</button>
  </div>
</div>

<script>
const calendar = document.getElementById("calendar");
const monthSel = document.getElementById("month");
const yearSel = document.getElementById("year");

let currentKey = "";
let currentMark = null;

const months = [
  "January","February","March","April","May","June",
  "July","August","September","October","November","December"
];

const dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

// Fill month selector
months.forEach((m,i)=>{
  let o=document.createElement("option");
  o.value=i; o.textContent=m;
  monthSel.appendChild(o);
});

// Fill year selector
for(let y=2020; y<=2035; y++){
  let o=document.createElement("option");
  o.value=y; o.textContent=y;
  yearSel.appendChild(o);
}

monthSel.value=new Date().getMonth();
yearSel.value=new Date().getFullYear();

function loadCalendar(){
  calendar.innerHTML="";
  let m=monthSel.value;
  let y=yearSel.value;

  let daysInMonth = new Date(y, Number(m)+1, 0).getDate();

  for(let d=1; d<=daysInMonth; d++){
    let dateObj = new Date(y, m, d);
    let dayIndex = dateObj.getDay();
    let dayName = dayNames[dayIndex];

    let box=document.createElement("div");
    box.className="day";

    let dayLabel=document.createElement("div");
    dayLabel.className="day-name";
    dayLabel.textContent=dayName;

    if(dayName==="Sun") dayLabel.classList.add("sunday");

    let num=document.createElement("div");
    num.className="day-number";
    num.textContent=d;

    let mark=document.createElement("div");
    mark.className="mark";

    let key=`${y}_${m}_${d}`;
    let saved=localStorage.getItem(key);
    if(saved){
      mark.textContent=saved;
      mark.style.color = saved==="✔" ? "green":"red";
    }

    box.onclick=()=>{
      currentKey=key;
      currentMark=mark;
      document.getElementById("popup").style.display="block";
    };

    box.append(dayLabel, num, mark);
    calendar.appendChild(box);
  }
}

function setMark(val){
  if(val===""){
    currentMark.textContent="";
    localStorage.removeItem(currentKey);
  } else {
    currentMark.textContent=val;
    currentMark.style.color = val==="✔" ? "green":"red";
    localStorage.setItem(currentKey,val);
  }
  closePopup();
}

function closePopup(){
  document.getElementById("popup").style.display="none";
}

function exportData(){
  let data=JSON.stringify(localStorage,null,2);
  let blob=new Blob([data],{type:"application/json"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="calendar_data.json";
  a.click();
}

monthSel.onchange=loadCalendar;
yearSel.onchange=loadCalendar;

loadCalendar();
  
 function exportExcel(){
  let rows = ["Year,Month,Date,Mark"];

  for(let i=0; i<localStorage.length; i++){
    let key = localStorage.key(i);
    let value = localStorage.getItem(key);

    if(value === "✔" || value === "✖"){
      let parts = key.split("_");
      let year = parts[0];
      let month = Number(parts[1]) + 1;
      let date = parts[2];

      rows.push(`${year},${month},${date},${value}`);
    }
  }

  let csv = rows.join("\n");
  let blob = new Blob([csv], { type: "text/csv" });
  let url = URL.createObjectURL(blob);

  let a = document.createElement("a");
  a.href = url;
  a.download = "calendar_data.csv";
  a.textContent = "Tap here to download Excel file";
  a.style.display = "block";
  a.style.margin = "10px";
  a.style.color = "blue";

  document.body.appendChild(a);
}
</script>

</body>
</html>
